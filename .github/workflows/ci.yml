name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # See https://symfony.com/releases & https://www.php.net/supported-versions.php
          - php-version: '8.2'
            symfony-version: '^7.0'
          - php-version: '8.3'
            symfony-version: '^7.0'
          - php-version: '8.4'
            symfony-version: '^7.0'
          - php-version: '8.4'
            symfony-version: '^8.0'
          - php-version: '8.5'
            symfony-version: '^7.0'
          - php-version: '8.5'
            symfony-version: '^8.0'

    name: "PHPUnit tests, PHP version ${{ matrix.php-version }} - Symfony Version: ${{matrix.symfony-version}}"
    steps:
      - uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            vendor
          key: composer-${{ runner.os }}-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ matrix.php-version }}-

      - name: Install specific symfony version
        run: composer require symfony/console:${{matrix.symfony-version}} symfony/dependency-injection:${{matrix.symfony-version}} -W

      - name: Run PHPUnit
        run: vendor/bin/phpunit -v
